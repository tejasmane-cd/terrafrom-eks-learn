name: Terraform PR

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".checkov.yaml"
      - ".tflint.hcl"
      - "bootstrap/**"
      - "environments/**"
      - "modules/**"
      - "README.md"

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  terraform:
    name: Terraform ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev]
    concurrency:
      group: terraform-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      AWS_ROLE_ARN: ${{ matrix.environment == 'dev' && vars.AWS_ROLE_ARN_DEV || vars.AWS_ROLE_ARN_PROD }}
      AWS_REGION: ${{ vars.TF_STATE_REGION }}
      TF_VAR_endpoint_public_access_cidrs: ${{ vars.TF_VAR_ENDPOINT_PUBLIC_ACCESS_CIDRS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform -chdir=environments/${{ matrix.environment }} init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${TF_STATE_REGION}"

      - name: Terraform validate
        run: terraform -chdir=environments/${{ matrix.environment }} validate

      - name: TFLint
        run: tflint --chdir=environments/${{ matrix.environment }} --recursive

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          quiet: true

      - name: Terraform plan
        run: terraform -chdir=environments/${{ matrix.environment }} plan -no-color -out=tfplan
